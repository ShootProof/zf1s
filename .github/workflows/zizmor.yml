name: Zizmor

on:
  pull_request:
    paths:
      - ".github/**"

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Annotations need no code scanning license. The action's hash also pins
      # zizmor, so a new release arrives with the Dependabot PR that bumps it.
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          annotations: true
          min-severity: medium
